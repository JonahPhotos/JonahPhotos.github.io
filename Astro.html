<body><header><nav class='top-nav'><a href="index.html" class="nav-btn-link">Home</a> <a href="https://www.instagram.com/jonah_photos_/" target="_blank" class="nav-btn-link">Instagram</a></nav><h1>Astrophotography</h1><div id="instruction" class="device-instruction"></div><script>document.addEventListener("DOMContentLoaded", function() { const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent); const text = isMobile ? "Tap to enlarge" : "Click to enlarge"; const el = document.getElementById("instruction"); if (el) el.innerText = text; });</script></header><main class='gallery-grid'><div class="photo-item" data-large="images/large/Astro/Powerlines_Astro.webp" data-name="Powerlines_Astro.JPG" onclick="openLightbox(0)"><img src="images/thumbs/Astro/Powerlines_Astro.webp" loading="lazy" alt="Powerlines_Astro.JPG"></div><div class="photo-item" data-large="images/large/Astro/Orion60D_Astro.webp" data-name="Orion60D_Astro.png" onclick="openLightbox(1)"><img src="images/thumbs/Astro/Orion60D_Astro.webp" loading="lazy" alt="Orion60D_Astro.png"></div><div class="photo-item" data-large="images/large/Astro/October 7 2025 Harvest moon Supermoon_Astro.webp" data-name="October 7 2025 Harvest moon Supermoon_Astro.png" onclick="openLightbox(2)"><img src="images/thumbs/Astro/October 7 2025 Harvest moon Supermoon_Astro.webp" loading="lazy" alt="October 7 2025 Harvest moon Supermoon_Astro.png"></div><div class="photo-item" data-large="images/large/Astro/M33_Astro.webp" data-name="M33_Astro.png" onclick="openLightbox(3)"><img src="images/thumbs/Astro/M33_Astro.webp" loading="lazy" alt="M33_Astro.png"></div><div class="photo-item" data-large="images/large/Astro/FullMoon_Astro.webp" data-name="FullMoon_Astro.png" onclick="openLightbox(4)"><img src="images/thumbs/Astro/FullMoon_Astro.webp" loading="lazy" alt="FullMoon_Astro.png"></div><div class="photo-item" data-large="images/large/Astro/Composite_Astro.webp" data-name="Composite_Astro.png" onclick="openLightbox(5)"><img src="images/thumbs/Astro/Composite_Astro.webp" loading="lazy" alt="Composite_Astro.png"></div><div class="photo-item" data-large="images/large/Astro/Andromeda Galaxy (M31)_Astro.webp" data-name="Andromeda Galaxy (M31)_Astro.png" onclick="openLightbox(6)"><img src="images/thumbs/Astro/Andromeda Galaxy (M31)_Astro.webp" loading="lazy" alt="Andromeda Galaxy (M31)_Astro.png"></div></main><div id="lightbox" class="lightbox-overlay"><span class="lb-close" onclick="closeLightbox()">&times;</span><span class="lb-prev" onclick="changeImage(-1)">&#10094;</span><div class="lb-content"><img id="lightbox-img" src=""><div id="lb-caption"></div></div><span class="lb-next" onclick="changeImage(1)">&#10095;</span></div><script>let images = []; let currentIndex = 0; function openLightbox(index) { images = Array.from(document.querySelectorAll('.photo-item')).map(i => ({ large: i.getAttribute('data-large'), name: i.getAttribute('data-name') })); currentIndex = index; updateLightbox(); document.getElementById('lightbox').style.display = 'flex'; } function closeLightbox() { document.getElementById('lightbox').style.display = 'none'; } function changeImage(dir) { currentIndex = (currentIndex + dir + images.length) % images.length; updateLightbox(); } function updateLightbox() { document.getElementById('lightbox-img').src = images[currentIndex].large; document.getElementById('lb-caption').innerText = images[currentIndex].name; } document.addEventListener('keydown', e => { if (e.key === "Escape") closeLightbox(); if (e.key === "ArrowRight") changeImage(1); if (e.key === "ArrowLeft") changeImage(-1); });</script></body></html>
